name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    name: lint, types, unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: mypy .
      - run: python -m scripts.scan_secrets  # nothing secret tracked (Phase 13)
      # `models` tests load the real embedding/reranker weights (the optional `models` extra,
      # not installed here); everything else uses deterministic fakes.
      - run: pytest -m "not db and not models"

  # Docker is used here only, on GitHub's runner — never in local development.
  db:
    name: Postgres tests (migrations, services, dashboards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Write CI .env (one throwaway DB serves as both app and test DB)
        run: |
          echo "POSTGRES_PASSWORD=ci-only-password" > .env
          echo "POSTGRES_TEST_DB=customs_copilot" >> .env
      - run: docker compose up -d --wait
      - name: Migrations apply and match the ORM models
        run: alembic upgrade head && alembic check
      - run: pytest -m "db and not models"
      - if: always()
        run: docker compose down -v
