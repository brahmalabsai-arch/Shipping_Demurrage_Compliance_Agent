# CI ONLY — used by .github/workflows/ci.yml on GitHub's runners.
# Local development does not use Docker: it runs against a native PostgreSQL install
# (scripts/setup_local_db.py) and an embedded, in-process ChromaDB (CHROMA_PATH).
# The image tracks the local Postgres major version so CI and local match.

name: customs-copilot-ci

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-customs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-customs_copilot}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
