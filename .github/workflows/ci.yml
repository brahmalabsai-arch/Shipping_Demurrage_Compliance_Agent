name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    name: lint, types, unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: mypy .
      - run: pytest

  # Docker is used here only, on GitHub's runner — never in local development.
  integration:
    name: Postgres integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Write CI .env
        run: echo "POSTGRES_PASSWORD=ci-only-password" > .env
      - run: docker compose up -d --wait
      - run: pytest -m integration
      - name: Alembic reaches the database
        run: alembic upgrade head && alembic current
      - if: always()
        run: docker compose down -v
