[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customs-copilot"
version = "0.1.0"
description = "Port & Customs Clearance Copilot — multi-agent shipment verification, demurrage risk and HITL clearance."
requires-python = ">=3.11"
# Runtime dependencies are added phase by phase, as each phase first needs them.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "chromadb>=1.5",
    "streamlit>=1.40",
    "tzdata>=2024.1",  # zoneinfo data (Asia/Kolkata) on Windows
    # <2: langchain-mcp-adapters (agents, Phase 6+) supports the 1.x SDK only.
    "mcp>=1.24,<2",
    "structlog>=25.1",
    # Agents (Phase 6+): LangGraph over MCP tools; LLMs via LangChain (Groq default, OpenAI).
    "langgraph>=1.0",
    "langchain-core>=1.3.3,<2",
    "langchain-mcp-adapters>=0.3,<0.4",
    "langchain-groq>=1.1",
    "langchain-openai>=1.0",
    # Regulatory Watch scheduler (3.x: 4.x is still pre-release).
    "apscheduler>=3.10,<4",
    # Gmail API + OAuth (architecture §7).
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    # Compliance RAG (Phase 9): the BM25 half of the hybrid retriever (pure Python).
    "rank-bm25>=0.2.2",
    # Supervisor (Phase 11): LangGraph checkpoints in Postgres (sync saver — see
    # agents/checkpoint.py for why not the async one on Windows).
    "langgraph-checkpoint-postgres>=3.0",
]

[project.optional-dependencies]
# The retriever's neural models (BGE embedder + MiniLM cross-encoder, as in PolicyMind). Needed
# to run the app and the `models` tests; CI skips both. Install CPU-only PyTorch first (Linux
# PyPI wheels bundle CUDA): pip install torch --index-url https://download.pytorch.org/whl/cpu
# then: pip install -e ".[dev,models]"
models = [
    "torch>=2.5",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = [
    "config*",
    "models*",
    "services*",
    "mcp_servers*",
    "agents*",
    "rag*",
    "scheduler*",
    "integrations*",
    "dashboards*",
]

# --------------------------------------------------------------------------- black
[tool.black]
line-length = 100
target-version = ["py311"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
# E501 is black's job.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "config",
    "models",
    "services",
    "mcp_servers",
    "agents",
    "rag",
    "scheduler",
    "integrations",
    "dashboards",
    "scripts",
    "tests",
]
# The local alembic/ migrations folder would otherwise make ruff treat the library as ours.
known-third-party = ["alembic"]

# --------------------------------------------------------------------------- mypy
# Strict everywhere by default (conventions §1 requires strict on services/, agents/,
# mcp_servers/); dashboards and tests are relaxed below.
# python_version is deliberately unset: mypy targets the running interpreter, since third-party
# stubs (e.g. numpy's) use syntax newer than 3.11. The CI matrix covers the 3.11 floor.
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
# alembic/ would shadow the installed `alembic` package as a module name.
exclude = ["^\\.venv/", "^alembic/", "^docs/", "^build/"]

# Third-party packages without type information.
[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "apscheduler.*", "httplib2.*",
          "rank_bm25.*", "sentence_transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dashboards.*", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "db: needs PostgreSQL (POSTGRES_TEST_DB); auto-applied to tests using the DB fixtures",
    "models: loads the real embedding/reranker models (downloads weights; skipped in CI)",
]
